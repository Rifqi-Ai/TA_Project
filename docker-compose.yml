version: "3.8"

services:
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123        # ganti nanti
      - N8N_TELEGRAM_BOT_TOKEN=8992268538:AAE3iz4xdvNjqxxZi0Rye0sOxGvg5nwH2wI   # <‑‑ ganti!
    volumes:
      - ./n8n_data:/home/node/.n8n

  openclaw:
    build: ./openclaw          # Dockerfile (lihat §4)
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
  recommender:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
