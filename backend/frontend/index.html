<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekomendasi Resep Indonesia</title>
<style>
  body {font-family: Arial, sans-serif; margin: 2rem;}
  textarea {width: 100%; height: 100px;}
  button {margin-top: 0.5rem; padding: 0.5rem 1rem;}
  .result {margin-top: 1rem; border-top: 1px solid #ccc; padding-top: 1rem;}
</style>
</head>
<body>
<h1>Rekomendasi Resep Masakan Indonesia</h1>
<p>Masukkan bahan yang tersedia (pisahkan dengan koma atau baris baru):</p>
<textarea id="ingredients"></textarea><br>
<button onclick="getRecommendations()">Cari Resep</button>
<div id="output" class="result"></div>
<script>
async function getRecommendations(){
  const raw = document.getElementById('ingredients').value;
  const list = raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const resp = await fetch('/recommend', {
    method: 'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ingredients: list})
  });
  const data = await resp.json();
  const out = document.getElementById('output');
  if(data.error){ out.innerHTML = '<p style="color:red">'+data.error+'</p>'; return; }
  out.innerHTML = data.recommendations.map(r=>`
    <h3>${r.recipe} (Score: ${r.score.toFixed(2)})</h3>
    <p><strong>Bahan:</strong> ${r.ingredients}</p>
    <p><strong>Langkah:</strong> ${r.steps || ''}</p>
  `).join('');
}
</script>
</body>
</html>
